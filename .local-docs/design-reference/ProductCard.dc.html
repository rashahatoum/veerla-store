<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Veerla — بطاقة المنتج</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<article dir="rtl" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onFocus="{{ enter }}" style="font-family: 'IBM Plex Sans Arabic', sans-serif; color: #2A0A20; width: 100%; display: flex; flex-direction: column; gap: 12px">
  <div style="position: relative; background: #F3E4D8; border-radius: 4px; overflow: hidden">
    <a href="Product.dc.html" style="display: block; position: relative">
      <img src="{{ p.img }}" alt="{{ p.name }}" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: {{ p.pos }}; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); transform: {{ zoom }}">    </a>
    <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}">
      <span style="position: absolute; top: 14px; right: 14px; background: #2A0A20; color: #EAD3AB; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 2px">{{ p.badge }}</span>
    </sc-if>
    <button type="button" aria-label="أضيفي إلى المفضلة" aria-pressed="{{ likedStr }}" onClick="{{ toggle }}" style="position: absolute; top: 10px; left: 10px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(252,247,242,0.92); color: #5A1F45; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.5-9-9a4.5 4.5 0 0 1 9-2.5A4.5 4.5 0 0 1 21 11c-2 4.5-9 9-9 9z"/></svg>
    </button>
    <button type="button" style="{{ btnStyle }}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      أضيفي للسلة
    </button>
  </div>
  <div style="display: flex; gap: 6px" aria-label="الألوان المتوفرة">
    <sc-for list="{{ p.colors }}" as="c" hint-placeholder-count="3">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: {{ c }}; box-shadow: 0 0 0 1px #FCF7F2, 0 0 0 2px #D9BFAF"></span>
    </sc-for>
  </div>
  <a href="Product.dc.html" style="display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #2A0A20">
    <h3 style="margin: 0; font-family: 'Amiri', serif; font-size: 20px; font-weight: 400; line-height: 1.5">{{ p.name }}</h3>
    <span style="font-size: 14px; color: #6E4A58">{{ p.sub }}</span>
  </a>
  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-size: 18px; font-weight: 600; color: #3D1030">{{ p.price }} ر.س</span>
    <sc-if value="{{ hasOld }}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 14px; color: #6E4A58; text-decoration: line-through">{{ p.old }} ر.س</span>
    </sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":320,"height":540}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { liked: false, hover: false }; }
  renderVals() {
    var p = this.props.item ?? { name: 'روب الفراشة المخملي', sub: 'مخمل ناعم بتطريز ذهبي', price: '349', old: '420', badge: 'جديد', img: '/_blob/c80b293200bd8fa46f7848cc7a60e3db', img2: '/_blob/3a7e5be9049b37cb33767735b9e35e50', pos: 'center', colors: ['#3D1030', '#824243', '#E3C3AE'] };
    var self = this, h = this.state.hover;
    var alts = ['/_blob/3a7e5be9049b37cb33767735b9e35e50', '/_blob/462ceb3fd896819805cb76a7f6b5b64f', '/_blob/e8aedb04be2458d016c8c86d6c39804a'];
    var img2 = p.img2 || alts[(p.name || '').length % 3];
    // silk wave: same point count in both states so the edge ripples upward
    var hidden = 'polygon(0% 112%, 10% 106%, 20% 101%, 30% 104%, 40% 110%, 50% 114%, 60% 109%, 70% 103%, 80% 101%, 90% 106%, 100% 112%, 100% 130%, 0% 130%)';
    var shown = 'polygon(0% -2%, 10% -8%, 20% -13%, 30% -10%, 40% -4%, 50% 0%, 60% -5%, 70% -11%, 80% -13%, 90% -8%, 100% -2%, 100% 130%, 0% 130%)';
    var imgBase = 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: clip-path 0.85s cubic-bezier(.65,0,.35,1); ';
    var btnBase = 'position: absolute; bottom: 12px; right: 12px; left: 12px; min-height: 46px; border: 0; border-radius: 2px; background: rgba(42,10,32,0.94); color: #F8EEE6; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .4s ease; ';
    return {
      p: p,
      img2: img2,
      img2Style: imgBase + 'clip-path: ' + (h ? shown : hidden),
      zoom: h ? 'scale(1.04)' : 'scale(1)',
      btnStyle: btnBase + (h ? 'transform: translateY(0); opacity: 1' : 'transform: translateY(16px); opacity: 0'),
      hasBadge: !!p.badge,
      hasOld: !!p.old,
      likedStr: this.state.liked ? 'true' : 'false',
      heartFill: this.state.liked ? 'currentColor' : 'none',
      toggle: function () { self.setState({ liked: !self.state.liked }); },
      enter: function () { if (!self.state.hover) self.setState({ hover: true }); },
      leave: function () { self.setState({ hover: false }); }
    };
  }
}
</script>
</body>
</html>
